---
- hosts: localhosts
  gather_facts: false
  async_governance: true
  async_orphan_policy: warn
  tasks:
    - block:
        - name: write a job file abandoned by a previous run (dead pid, unfinished)
          copy:
            dest: "{{ ansible_async_dir }}/jorph.99999"
            content: '{"started": true, "finished": false, "ansible_job_id": "jorph.99999"}'

        - name: submit a real job, triggering enforcement
          command: sleep 30
          async: 30
          poll: 0
          register: realjob

        - name: query lists the running job and the abandoned job
          async_governance:
            mode: query
          register: q

        - debug:
            var: q

        - assert:
            that:
              - q.running_count == 1
              - q.orphaned_jobs | length == 1
              - q.orphaned_jobs[0].jid == 'jorph.99999'
              - q.orphaned_jobs[0].pid == 99999
      always:
        - name: clean up the real job
          async_status:
            jid: "{{ realjob.ansible_job_id }}"
            mode: cleanup
          when: realjob is defined and realjob.ansible_job_id is defined

        - name: clean up the abandoned file
          file:
            path: "{{ ansible_async_dir }}/jorph.99999"
            state: absent

minor_changes:
  - async - added default-off lifecycle governance for asynchronous jobs. New play keywords ``async_max_jobs`` (with ``async_overflow_policy`` set to ``wait`` or ``reject``) limit the number of async jobs running per host, ``async_job_ttl`` enables automatic reclamation of finished job files, ``async_orphan_policy`` (``warn``, ``reclaim`` or ``fail``) handles jobs abandoned by a previous controller run, and the ``async_governance`` module provides a query entry listing running jobs, abandoned jobs and the latest reclamation result. Host variable overrides ``ansible_async_max_jobs``, ``ansible_async_job_ttl``, ``ansible_async_overflow_policy`` and ``ansible_async_orphan_policy`` are supported.
